<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 편집기 검증 · 저장되지 않음</title><link rel="stylesheet" href="site/admin.css"><link rel="stylesheet" href="site/photo-editor.css"><body><main class="wrap"><h1>검증용 편집기 · 실제 저장 안 됨</h1><button id="runChecks" class="btn">편집기 검증 실행</button><pre id="qaReport"></pre><p id="editorStatus"></p><button id="saveSiteContent">홈페이지에 저장</button><button id="previewHome">미리보기</button><button id="editorRefresh">새로 불러오기</button><div id="siteEditor"></div></main><dialog id="homePreview"><button id="closeHomePreview">닫기</button><iframe id="homePreviewFrame" title="미리보기"></iframe></dialog>
<script type="module">
import {initSiteEditor} from './site/admin-editor.js?v=3.1.1';
import {configurePhotoStorage,preparePhoto,createPhotoUploader} from './site/photo-upload.js?v=3.1.1';
let mock={mainTitle:'검증용 제목',siteContent:{activities:[{id:'legacy-activity',title:'기존 활동',body:'기존 내용',date:'테스트',image:'team-logo.png',visible:true,customField:'보존'}]}},patches=[];
const set=(o,p,v)=>{const a=p.split('.');for(const k of a.slice(0,-1))o=o[k]??={};o[a.at(-1)]=v};
let failNextUpload=false;
const editor=initSiteEditor({read:async()=>structuredClone(mock),write:async patch=>{patches.push(patch);for(const [p,v]of Object.entries(patch))set(mock,p,v);return structuredClone(mock)},isSignedIn:()=>true,notify:()=>{},uploadPhoto:async(file,progress)=>{if(failNextUpload){failNextUpload=false;throw Object.assign(new Error('Test permission error'),{code:'storage/unauthorized'})}progress(100);return 'site/assets/arena-gold.webp'}});
await editor.load();
document.querySelector('#runChecks').onclick=async()=>{
const results=[],assert=(name,pass)=>results.push({name,pass:Boolean(pass)}),setInput=(selector,value)=>{const el=document.querySelector(selector);el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));return el};
assert('기존 데이터 읽기 후 변경 없음',!editor.hasUnsaved());
document.querySelector('[data-editor-tab="activities"]').click();
assert('활동 대표사진/여러장 업로드 버튼',document.querySelectorAll('[data-photo-target]').length===2);
const photoButtons=[...document.querySelectorAll('button.photoUploadButton')];
assert('버튼 이름 명확히 표시',photoButtons.map(b=>b.textContent).join(',')==='대표 사진 선택,사진 여러 장 추가');
const lum=color=>{const rgb=color.match(/[\d.]+/g).slice(0,3).map(Number).map(v=>v/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722};
const style=getComputedStyle(photoButtons[0]),fg=lum(style.color),bg=lum(style.backgroundColor);
assert('버튼 글씨 대비 4.5:1 이상',(Math.max(fg,bg)+.05)/(Math.min(fg,bg)+.05)>=4.5);
setInput('[data-repeat-field="photos"]','dreamers-logo.png\nsite/assets/arena-gold.webp');
assert('사진 미리보기 표시',document.querySelectorAll('.photoEditorThumb').length===3);
await editor.save();assert('홈페이지 활동 경로만 저장',Object.keys(patches[0]||{}).join(',')==='siteContent.activities');
assert('기존 대표사진 유지',mock.siteContent.activities[0].image==='team-logo.png');assert('기존 추가 필드 보존',mock.siteContent.activities[0].customField==='보존');assert('여러장 저장',mock.siteContent.activities[0].photos.length===2);
setInput('[data-repeat-field="photos"]','javascript:alert(1)');await editor.save();assert('위험한 URL 저장 차단',patches.length===1);
setInput('[data-repeat-field="photos"]',Array.from({length:11},(_,i)=>'https://example.com/'+i+'.jpg').join('\n'));await editor.save();assert('10장 제한',patches.length===1);
setInput('[data-repeat-field="photos"]','dreamers-logo.png\nsite/assets/arena-gold.webp');
const picker=document.querySelector('[data-photo-many="false"]'),transfer=new DataTransfer();transfer.items.add(new File(['test'],'test.jpg',{type:'image/jpeg'}));picker.files=transfer.files;picker.dispatchEvent(new Event('change',{bubbles:true}));
await new Promise(r=>setTimeout(r,200));assert('선택 파일 업로드 UI 처리',document.querySelector('[data-repeat-field="image"]').value==='site/assets/arena-gold.webp');assert('업로드만으로 DB 저장하지 않음',patches.length===1);
await editor.save();assert('별도 저장 성공',patches.length===2&&!editor.hasUnsaved());
failNextUpload=true;const failedPicker=document.querySelector('[data-photo-many="false"]'),failedTransfer=new DataTransfer();failedTransfer.items.add(new File(['test'],'retry.jpg',{type:'image/jpeg'}));failedPicker.files=failedTransfer.files;failedPicker.dispatchEvent(new Event('change',{bubbles:true}));await new Promise(r=>setTimeout(r,100));
assert('업로드 실패 후에도 기존 대표 사진 보존',document.querySelector('[data-repeat-field="image"]').value==='site/assets/arena-gold.webp');
assert('상단에 업로드 오류 유지',document.querySelector('#editorStatus').textContent.includes('storage/unauthorized'));
assert('실패를 저장 완료로 표시하지 않음',document.querySelector('.photoUploadStatus[data-state="error"]')?.textContent.includes('사진 업로드 실패'));
assert('업로드 오류로 DB 변경 없음',patches.length===2);
try{
 const sdk=await import('https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js');
 const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js');
 const app=initializeApp({projectId:'demo-photo-validation',apiKey:'demo',storageBucket:'demo-photo-validation.invalid'},'photo-check-'+Date.now());
 assert('오류 원인 재현: 기존 함수는 SDK에 없음',typeof sdk.setMaxUploadRetryTime==='undefined'&&typeof sdk.setMaxOperationRetryTime==='undefined');
 const storage=configurePhotoStorage(sdk,app);assert('실제 SDK 업로드 재시도 설정',storage.maxUploadRetryTime===20000);assert('실제 SDK URL 조회 재시도 설정',storage.maxOperationRetryTime===15000);
 assert('실제 SDK 업로드·사진주소 함수 존재',typeof sdk.uploadBytesResumable==='function'&&typeof sdk.getDownloadURL==='function');
 const canvas=document.createElement('canvas');canvas.width=2200;canvas.height=1100;canvas.getContext('2d').fillRect(0,0,2200,1100);
 const sourceBlob=await new Promise(r=>canvas.toBlob(r,'image/png')),file=new File([sourceBlob],'fixture.png',{type:'image/png'});
 const result=await preparePhoto(file),bitmap=await createImageBitmap(result);assert('실제 이미지 압축·크기 제한',result.type==='image/jpeg'&&bitmap.width===1800&&bitmap.height===900);bitmap.close();
 let rejected=false;try{await createPhotoUploader(app,{currentUser:null})(file)}catch{rejected=true}assert('로그인 없이 파일 전송 차단',rejected);
}catch(error){results.push({name:'실제 SDK / 이미지 처리',pass:false,error:error.message})}
const report=document.querySelector('#qaReport');report.textContent=JSON.stringify(results,null,2);report.dataset.result=results.every(r=>r.pass)?'PASS':'FAIL';
};
</script></body></html>
