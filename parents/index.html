<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080909">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="청명초 탁구부 학부모 경기 결과 조회">
  <title>우리 아이 경기 기록 | 청명초 탁구부</title>
  <link rel="stylesheet" href="./parents.css?v=2.0.0">
</head>
<body>
<a class="skip" href="#lookupForm">경기 조회로 이동</a>
<header class="header"><a class="brand" href="../"><img src="../team-logo.png" width="72" height="72" alt="청명초 탁구부"><span><strong>청명초 탁구부</strong><small>FAMILY MATCH RECORD</small></span></a><span class="viewBadge">학부모 경기 조회</span></header>
<main class="main">
  <section class="searchPanel" aria-labelledby="pageTitle">
    <div class="eyebrow">우리 아이의 도전, 한 경기씩.</div>
    <h1 id="pageTitle">경기 <span>기록.</span></h1>
    <p class="intro" id="lookupHint">이름을 검색하면 코치님이 저장한 경기 결과가 실시간으로 표시됩니다.</p>
    <form id="lookupForm" class="lookupForm">
      <div class="nameField"><label for="playerName">자녀 이름</label><input id="playerName" name="playerName" type="search" maxlength="40" placeholder="이름을 입력해 주세요" autocomplete="off" required></div>
      <button id="lookupButton" class="button gold" type="submit">경기 조회 <span aria-hidden="true">↗</span></button>
    </form>
    <p id="lookupStatus" class="status" role="status" aria-live="polite"></p>
    <div id="playerChoices" class="playerChoices" role="group" aria-label="같은 이름의 선수 선택" hidden></div>
  </section>
  <section id="report" class="report" aria-labelledby="athleteName" hidden>
    <div class="athleteHead"><div><div class="eyebrow">PLAYER RECORD</div><h2 id="athleteName" tabindex="-1"></h2><p id="athleteMeta"></p></div><div class="updated"><span id="updatedAt"></span><button id="refreshReport" class="button quiet" type="button">새로고침</button></div></div>
    <form id="recordFilters" class="filters" aria-label="경기 기록 필터">
      <label>경기 구분<select id="sourceFilter"><option value="match">일반 경기</option><option value="league">리그전</option><option value="competition">대회 기록</option><option value="all">전체 기록 모아 보기</option></select></label>
      <label>시작일<input id="dateFrom" type="date"></label><label>종료일<input id="dateTo" type="date"></label>
      <label>결과<select id="resultFilter"><option value="all">전체 결과</option><option value="win">승리</option><option value="loss">패배</option></select></label>
      <button id="resetFilters" class="button quiet" type="button">필터 초기화</button>
    </form>
    <p id="filterStatus" class="status" role="status"></p>
    <div id="matchMetrics" class="metrics" aria-label="조회한 경기 요약"><div><span>조회한 경기</span><strong id="totalMatches">0</strong></div><div><span>승리</span><strong id="totalWins" class="win">0</strong></div><div><span>패배</span><strong id="totalLosses">0</strong></div><div><span>승률</span><strong id="winRate">—</strong></div></div>
    <div class="recordHeading"><h3>경기별 기록</h3><span id="recordCount"></span></div>
    <p id="recordNote" class="recordNote">점수는 우리 아이 기준 세트 점수입니다.</p>
    <div id="matchList" class="matchList"></div>
    <button id="moreMatches" class="button more" type="button" hidden>경기 더 보기</button>
  </section>
  <div id="welcome" class="welcome"><span class="rule" aria-hidden="true"></span><p>일반 경기 · 리그전 · 대회 기록</p><small>코치님이 저장한 결과를 확인할 수 있습니다.</small></div>
</main>
<footer class="footer"><span>CHEONGMYEONG TABLE TENNIS</span><p>기록 확인이나 수정이 필요하면 코치님께 말씀해 주세요.</p><a href="../">청명초 탁구부 홈페이지</a></footer>
<noscript><p>경기 기록을 조회하려면 자바스크립트를 켜주세요.</p></noscript>
<script type="module" src="./parents.js?v=2.0.0"></script>
</body>
</html>
