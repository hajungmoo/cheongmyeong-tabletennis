<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07121e"><title>청명 알림장 미리보기</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="app.css?v=1"><style>
body{padding:24px 18px 40px}.previewHeader{max-width:1140px;margin:0 auto 25px;display:flex;align-items:center;justify-content:space-between;gap:20px}.previewHeader p{font-size:12px;margin-top:7px}.previewTabs{display:flex;gap:8px;flex-wrap:wrap}.previewBody{margin:auto;display:flex;justify-content:center}.device{width:410px;max-width:100%;padding:9px;border:1px solid #e7c27a42;border-radius:32px;background:#101c29;box-shadow:0 30px 90px #0005;transition:width .2s}iframe{display:block;width:100%;height:830px;border:0;border-radius:24px;background:#07121e}.device.wide{width:1140px;border-radius:20px}.device.wide iframe{border-radius:12px}.previewNote{text-align:center;margin:18px auto 0;max-width:650px;font-size:12px}.previewHeader .brand{flex-shrink:0}@media(max-width:650px){.previewHeader{display:block}.previewTabs{margin-top:18px}.device{padding:0;border:0;box-shadow:none}iframe{height:780px;border-radius:18px}body{padding:18px 10px}.previewHeader{padding:0 9px}}
</style></head><body><header class="previewHeader"><div><a class="brand" href="./?demo=1"><img src="icon.svg" width="42" height="42" alt=""><span><b>청명 알림장</b><small>함께 준비하는 우리 팀의 내일</small></span></a><p>사진과 공지를 담은 우리 팀 전용 알림장</p></div><nav class="previewTabs" aria-label="미리보기 화면"><button class="chip active" data-view="student" aria-pressed="true">선수 휴대폰</button><button class="chip" data-view="coach-mobile" aria-pressed="false">코치 휴대폰</button><button class="chip" data-view="coach" aria-pressed="false">코치 PC</button></nav></header><main class="previewBody"><div class="device" id="device"><iframe id="appPreview" title="청명 알림장 미리보기" src="./?demo=1"></iframe></div></main><p class="previewNote">예시 화면입니다. 작성·사진 첨부·예약 변경을 체험할 수 있으며,<br>실제 저장이나 휴대폰 알림은 발송되지 않습니다.</p><script>
const frame=document.getElementById('appPreview'),device=document.getElementById('device');document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(other=>{other.classList.toggle('active',other===button);other.setAttribute('aria-pressed',String(other===button));});device.classList.toggle('wide',button.dataset.view==='coach');frame.src=button.dataset.view==='student'?'./?demo=1':'admin.html?demo=1';}));
</script></body></html>
