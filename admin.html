<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>청명초 탁구부 관리자</title>
</head>

<body style="margin:0; font-family:Arial,sans-serif; background:#f4f7fb; color:#111;">

<div style="background:#111827; color:white; padding:30px; text-align:center;">
  <h1>👨‍🏫 관리자 페이지</h1>
  <p>공지 작성 · 문의 확인 · 홈페이지 관리</p>
</div>

<div style="max-width:900px; margin:auto; padding:30px;">

  <section style="background:white; padding:25px; border-radius:20px; margin-bottom:25px;">
    <h2>📢 공지 작성</h2>

    <input id="noticeTitle" type="text" placeholder="공지 제목"
    style="width:95%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">

    <textarea id="noticeContent" placeholder="공지 내용을 입력하세요"
    style="width:95%; height:120px; padding:12px; border-radius:10px; border:1px solid #ddd;"></textarea>

    <br><br>

    <button onclick="saveNotice()"
    style="padding:12px 30px; border:none; border-radius:10px; background:#111827; color:white;">
      공지 저장
    </button>
  </section>

  <section style="background:white; padding:25px; border-radius:20px; margin-bottom:25px;">
    <h2>📋 저장된 공지</h2>
    <div id="noticeList">불러오는 중...</div>
  </section>
<section style="background:white; padding:25px; border-radius:20px; margin-bottom:25px;">
  <h2>🏓 선수 추가</h2>

  <input id="playerName" type="text" placeholder="선수 이름"
  style="width:95%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">

  <input id="playerGrade" type="text" placeholder="학년"
  style="width:95%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">

  <input id="playerStyle" type="text" placeholder="전형"
  style="width:95%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">

  <input id="playerAward" type="text" placeholder="수상 기록"
  style="width:95%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">

  <button onclick="savePlayer()"
  style="padding:12px 30px; border:none; border-radius:10px; background:#7c3aed; color:white;">
    선수 저장
  </button>
</section>

<section style="background:white; padding:25px; border-radius:20px; margin-bottom:25px;">
  <h2>👥 저장된 선수</h2>
  <div id="playerList">불러오는 중...</div>
</section>
  <section style="background:white; padding:25px; border-radius:20px; margin-bottom:25px;">
  <h2>📝 체험 신청 확인</h2>
  <div id="trialList">불러오는 중...</div>
</section>
  <div style="text-align:center;">
    <a href="index.html">
      <button style="padding:12px 30px; border:none; border-radius:10px;">
        홈페이지로 돌아가기
      </button>
    </a>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCbZ9CUf_hJRAKs2T7MYK7Z4YBNjn7p9pI",
  authDomain: "cheongmyeong-tabletennis.firebaseapp.com",
  projectId: "cheongmyeong-tabletennis",
  storageBucket: "cheongmyeong-tabletennis.firebasestorage.app",
  messagingSenderId: "712801821489",
  appId: "1:712801821489:web:501d20626d8cd12dc98610"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function saveNotice() {
  const title = document.getElementById("noticeTitle").value;
  const content = document.getElementById("noticeContent").value;

  if (!title || !content) {
    alert("제목과 내용을 모두 입력해주세요.");
    return;
  }

  await addDoc(collection(db, "notices"), {
    title: title,
    content: content,
    createdAt: serverTimestamp()
  });

  alert("공지 저장 완료!");
  document.getElementById("noticeTitle").value = "";
  document.getElementById("noticeContent").value = "";
  loadNotices();
}

async function loadNotices() {
  const list = document.getElementById("noticeList");
  list.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "notices"));

  if (querySnapshot.empty) {
    list.innerHTML = "아직 저장된 공지가 없습니다.";
    return;
  }

  querySnapshot.forEach((noticeDoc) => {
    const data = noticeDoc.data();

    const box = document.createElement("div");
    box.style.background = "#f9fafb";
    box.style.padding = "15px";
    box.style.marginBottom = "10px";
    box.style.borderRadius = "12px";

    box.innerHTML = `
      <h3>${data.title}</h3>
      <p>${data.content}</p>
      <button onclick="deleteNotice('${noticeDoc.id}')">삭제</button>
    `;

    list.appendChild(box);
  });
}

async function deleteNotice(id) {
  await deleteDoc(doc(db, "notices", id));
  alert("삭제 완료!");
  loadNotices();
}

window.saveNotice = saveNotice;
  async function savePlayer() {

  const name = document.getElementById("playerName").value;
  const grade = document.getElementById("playerGrade").value;
  const style = document.getElementById("playerStyle").value;
  const award = document.getElementById("playerAward").value;

  if (!name || !grade) {
    alert("선수 이름과 학년을 입력해주세요.");
    return;
  }

  await addDoc(collection(db, "players"), {
    name,
    grade,
    style,
    award
  });

  alert("선수 저장 완료!");

  document.getElementById("playerName").value = "";
  document.getElementById("playerGrade").value = "";
  document.getElementById("playerStyle").value = "";
  document.getElementById("playerAward").value = "";

  loadPlayers();
}

async function loadPlayers() {

  const list = document.getElementById("playerList");

  list.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "players"));

  if (querySnapshot.empty) {
    list.innerHTML = "저장된 선수가 없습니다.";
    return;
  }

  querySnapshot.forEach((playerDoc) => {

    const data = playerDoc.data();

    const box = document.createElement("div");

    box.style.background = "#f9fafb";
    box.style.padding = "15px";
    box.style.marginBottom = "10px";
    box.style.borderRadius = "12px";

    box.innerHTML = `
      <h3>${data.name}</h3>
      <p>${data.grade}</p>
      <p>${data.style || ""}</p>
      <p>${data.award || ""}</p>
      <button onclick="deletePlayer('${playerDoc.id}')">삭제</button>
    `;

    list.appendChild(box);

  });

}

async function deletePlayer(id) {

  await deleteDoc(doc(db, "players", id));

  alert("선수 삭제 완료!");

  loadPlayers();
}

window.savePlayer = savePlayer;
window.deletePlayer = deletePlayer;

loadPlayers();
window.deleteNotice = deleteNotice;

loadNotices();
  async function loadTrials() {

  const list = document.getElementById("trialList");

  list.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "trials"));

  if (querySnapshot.empty) {
    list.innerHTML = "아직 체험 신청이 없습니다.";
    return;
  }

  querySnapshot.forEach((trialDoc) => {

    const data = trialDoc.data();

    const box = document.createElement("div");

    box.style.background = "#f9fafb";
    box.style.padding = "15px";
    box.style.marginBottom = "10px";
    box.style.borderRadius = "12px";

    box.innerHTML = `
      <h3>${data.name}</h3>
      <p>학년: ${data.grade}</p>
      <p>연락처: ${data.phone}</p>
      <button onclick="deleteTrial('${trialDoc.id}')">삭제</button>
    `;

    list.appendChild(box);

  });

}

async function deleteTrial(id) {

  await deleteDoc(doc(db, "trials", id));

  alert("체험 신청 삭제 완료!");

  loadTrials();

}

window.deleteTrial = deleteTrial;

loadTrials();
</script>

</body>
</html>
