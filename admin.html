<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>청명초 탁구부 관리자</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background:#f4f4f4; color:#222;">

<div style="background:#111827; color:white; padding:30px; text-align:center;">
  <h1>👨‍🏫 청명초 탁구부 관리자</h1>
  <p>공지 · 사진 · 선수 · 문의 관리</p>
</div>

<div style="max-width:900px; margin:auto; padding:30px;">

  <section style="background:white; padding:25px; border-radius:18px; margin-bottom:25px;">
    <h2>📢 공지 작성</h2>
    <input type="text" placeholder="공지 제목" style="width:95%; padding:12px; margin:8px 0;"><br>
    <textarea placeholder="공지 내용을 입력하세요" style="width:95%; height:120px; padding:12px;"></textarea><br>
    <button onclick="alert('공지 저장 완료! 메인 홈페이지에는 직접 복사해서 반영해야 합니다.')" style="padding:10px 25px; margin-top:10px;">공지 저장</button>
  </section>

  <section style="background:white; padding:25px; border-radius:18px; margin-bottom:25px;">
    <h2>📸 사진 업로드</h2>
    <input type="file" accept="image/*"><br><br>
    <p style="color:#777;">사진은 GitHub에 직접 업로드한 뒤 index.html에 연결해야 실제 홈페이지에 보입니다.</p>
  </section>

  <section style="background:white; padding:25px; border-radius:18px; margin-bottom:25px;">
    <h2>🏆 수상 기록 관리</h2>
    <input type="text" placeholder="선수 이름" style="width:95%; padding:12px; margin:8px 0;"><br>
    <input type="text" placeholder="수상 내용" style="width:95%; padding:12px; margin:8px 0;"><br>
    <button onclick="alert('수상 기록 저장 완료!')" style="padding:10px 25px;">저장</button>
  </section>

  <section style="background:white; padding:25px; border-radius:18px; margin-bottom:25px;">
    <h2>👥 선수 정보 수정</h2>
    <textarea style="width:95%; height:150px; padding:12px;">6학년 팡제이 - 오른손 쉐이크핸드 / 2026 전국초등학교 회장기대회 개인 3위
6학년 강다윤 - 오른손 쉐이크핸드
5학년 이수빈 - 오른손 이질러버
3학년 천윤슬 - 오른손 쉐이크핸드
2학년 양하은 - 오른손 쉐이크핸드</textarea><br>
    <button onclick="alert('선수 정보 저장 완료! 메인 홈페이지에는 직접 반영해야 합니다.')" style="padding:10px 25px; margin-top:10px;">선수 정보 저장</button>
  </section>

  <section style="background:white; padding:25px; border-radius:18px; margin-bottom:25px;">
    <h2>📩 문의 확인</h2>
    <div style="background:#f9fafb; padding:15px; border-radius:12px; margin-bottom:10px;">
      <b>예시 문의</b><br>
      2학년 학부모 / 체험수업 문의<br>
      “초보자도 참여 가능한가요?”
    </div>
    <p style="color:#777;">실제 문의 저장 기능은 Google Form 또는 Firebase 연결이 필요합니다.</p>
  </section>

  <div style="text-align:center;">
    <a href="index.html">
      <button style="padding:10px 25px;">홈페이지로 돌아가기</button>
    </a>
  </div>

</div>

</body>
</html>
