name: CM Yuseungmin roster one-time update

on:
  push:
    paths:
      - .github/workflows/cm-yuseungmin-roster-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install roster migration and patch manager
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = """"""
          js = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          out = Path("manager/yuseungmin-roster-2026.js")
          out.write_text(js, encoding="utf-8")

          index = Path("manager/index.html")
          text = index.read_text(encoding="utf-8")
          tag = '<script src="./yuseungmin-roster-2026.js?v=20260929"></script>'
          if tag not in text:
              anchor = '<script src="./manager-v4.js?v=4.0.0"></script>'
              if anchor not in text:
                  raise SystemExit("manager-v4 script anchor not found")
              text = text.replace(anchor, anchor + "\n" + tag, 1)
              index.write_text(text, encoding="utf-8")
          PY
          node --check manager/yuseungmin-roster-2026.js
      - name: Commit update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "cm-roster-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/cm-yuseungmin-roster-once.yml
          git add manager/index.html manager/yuseungmin-roster-2026.js .github/workflows/cm-yuseungmin-roster-once.yml
          git commit -m "Update manager roster from 2026 Yuseungmin Cup entries"
          git push
