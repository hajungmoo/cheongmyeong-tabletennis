name: CM safe sync one-time patch

on:
  push:
    paths:
      - .github/workflows/cm-safe-sync-once.yml
      - scripts/cm_safe_sync_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe sync patch
        run: python scripts/cm_safe_sync_patch.py
      - name: Commit patched manager
        run: |
          git config user.name "cm-safe-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manager/index.html manager/manager-v4.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make manager cloud sync safe across devices"
          git push
